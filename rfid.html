<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFID Attendance Dashboard</title>
  <link rel="stylesheet" href="rfid.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>RFID Attendance Dashboard</h1>
      <p class="subtitle">Teacher attendance monitor</p>
    </header>

    <section id="login-card" class="card">
      <h2>Teacher Login</h2>
      <form id="login-form" class="form-grid">
        <div style="text-align:center; margin-top:15px;">
          <div id="qr-box"></div>
        </div>
        <label>Email <input type="email" id="email" required /></label>
        <label>Password <input type="password" id="password" required /></label>
        <button type="submit">Login</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="toolbar card">
        <div class="toolbar-item"><span class="label">User</span><strong id="teacher-email">-</strong></div>
        <div class="toolbar-item">
          <label class="label">Subject</label>
          <select id="subject-select"></select>
        </div>
        <div class="toolbar-item"><span class="label">Date</span><strong id="active-date">-</strong></div>
        <button id="logout-btn" class="secondary-btn">Logout</button>
      </div>

      <section class="card">
        <div class="stats">
          <div class="card"><h3 id="total-students">0</h3><p>Total</p></div>
          <div class="card"><h3 id="present-today">0</h3><p>Present</p></div>
          <div class="card"><h3 id="attendance-percent">0%</h3><p>Rate</p></div>
        </div>
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Status</th><th>Time</th><th>Total</th><th>%</th></tr>
          </thead>
          <tbody id="students-body"></tbody>
        </table>
      </section>
    </section>
  </main>

  <div id="scan-overlay" class="scan-overlay hidden">
    <div class="scan-content">
      <div class="scan-status">✅ Attendance Marked!</div>
      <img id="popup-student-image" src="" alt="Photo" style="width:150px; height:150px; border-radius:50%; object-fit:cover; border:4px solid #2563eb;">
      <h2 id="popup-student-name"></h2>
      <p id="popup-student-id"></p>
    </div>
  </div>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
      <p id="modal-text"></p>
      <div class="modal-btns">
        <button id="modal-confirm" class="danger-btn">Yes</button>
        <button id="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="rfid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</body>
</html>
